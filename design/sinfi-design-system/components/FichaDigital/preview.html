<!-- @dsCard group="Reserva" height=420 subtitle="Ficha tipo boarding pass con QR" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:var(--space-4);background:var(--bg);font-family:var(--font-text);display:flex;justify-content:center}
  .ficha{width:100%;max-width:340px;background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-card);position:relative;overflow:hidden}
  .head{background:var(--brand);color:var(--on-brand);padding:var(--space-4);display:flex;justify-content:space-between;align-items:center}
  .esp{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:24px}
  .hosp{font-size:13px;line-height:18px;opacity:.9}
  .turno{font-family:var(--font-display);font-weight:800;font-size:36px;line-height:40px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:var(--space-4);padding:var(--space-4)}
  .k{font-size:13px;line-height:18px;font-weight:500;color:var(--muted)}
  .v{font-family:var(--font-display);font-weight:700;font-size:20px;line-height:26px;color:var(--ink)}
  .cut{position:relative;border-top:2px dashed var(--line);margin:0 var(--space-4)}
  .cut::before,.cut::after{content:"";position:absolute;top:-12px;width:24px;height:24px;border-radius:50%;background:var(--bg)}
  .cut::before{left:calc(-1 * var(--space-4) - 12px)}
  .cut::after{right:calc(-1 * var(--space-4) - 12px)}
  .foot{display:flex;gap:var(--space-4);align-items:center;padding:var(--space-4)}
  .qr{width:88px;height:88px;flex:none}
  .note{font-size:15px;line-height:22px;color:var(--ink)}
  .note small{display:block;font-size:13px;line-height:18px;color:var(--muted);margin-top:var(--space-1)}
</style></head>
<body>
<div class="ficha">
  <div class="head">
    <div><div class="esp">Medicina general</div><div class="hosp">Hospital de ejemplo · Tarija</div></div>
    <div class="turno">14</div>
  </div>
  <div class="grid">
    <div><div class="k">Día</div><div class="v">Lun 5 oct</div></div>
    <div><div class="k">Llega a las</div><div class="v">06:45</div></div>
    <div><div class="k">Paciente</div><div class="v">María Quispe</div></div>
    <div><div class="k">Carnet</div><div class="v">1234567</div></div>
  </div>
  <div class="cut"></div>
  <div class="foot">
    <svg class="qr" viewBox="0 0 9 9" role="img" aria-label="Código QR de ejemplo" shape-rendering="crispEdges"><rect width="9" height="9" fill="var(--surface)"/><g fill="var(--brand)"><path d="M0 0h3v3H0zM6 0h3v3H6zM0 6h3v3H0z"/><path d="M4 0h1v1H4zM4 2h1v2H4zM5 4h2v1H5zM3 4h1v1H3zM6 6h1v1H6zM8 6h1v1H8zM5 7h1v2H5zM7 8h2v1H7zM4 5h1v1H4z"/></g><g fill="var(--surface)"><path d="M1 1h1v1H1zM7 1h1v1H7zM1 7h1v1H1z"/></g></svg>
    <div class="note">Preséntate 15 minutos antes.<small>Muestra este código en ventanilla.</small></div>
  </div>
</div>
</body></html>
