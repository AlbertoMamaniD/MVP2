<!-- @dsCard group="Marca" height=220 subtitle="Principal, invertida e ícono" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:var(--space-4);background:var(--surface);font-family:var(--font-text);display:flex;gap:var(--space-4);flex-wrap:wrap;align-items:stretch}
  .tile{flex:1 1 200px;min-height:130px;border-radius:var(--radius-lg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-3);padding:var(--space-4);border:1px solid var(--line)}
  .main{background:var(--bg);color:var(--brand)}
  .inv{background:var(--brand);color:var(--on-brand);border-color:var(--brand)}
  .icon-tile{background:var(--bg);color:var(--brand)}
  .logo{display:flex;align-items:center;gap:10px}
  .word{font-family:var(--font-display);font-weight:800;font-size:40px;line-height:1;letter-spacing:-0.02em}
  .cap{font-size:13px;color:inherit;opacity:.85}
  .ticket{fill:currentColor}
  .check{fill:none;stroke:var(--check);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}
  .main{--check:var(--bg)} .inv{--check:var(--brand)} .icon-tile{--check:var(--bg)}
</style></head>
<body>
<div class="tile main">
  <img src="/_blob/52cd34b0c082634858e4f18061076c15" alt="Logo de Sinfi" style="height:64px;width:auto;mix-blend-mode:multiply">
  <span class="cap">Principal</span>
</div>
<div class="tile inv">
  <div class="logo">
    <svg width="44" height="35" viewBox="0 0 36 28" aria-hidden="true"><path class="ticket" d="M6 0H30a6 6 0 0 1 6 6V10a4 4 0 0 0 0 8V22a6 6 0 0 1-6 6H6a6 6 0 0 1-6-6V18a4 4 0 0 0 0-8V6a6 6 0 0 1 6-6Z"/><path class="check" d="M11 14.5l5 5 9-10.5"/></svg>
    <span class="word">sinfi</span>
  </div>
  <span class="cap">Invertida (reconstruida)</span>
</div>
<div class="tile icon-tile">
  <img src="/_blob/d9466815fcddf22ecd5b422b1a261ad7" alt="Ícono de Sinfi" style="height:72px;width:72px;border-radius:16px">
  <span class="cap">Ícono</span>
</div>
</body></html>
