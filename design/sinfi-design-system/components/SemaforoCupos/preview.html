<!-- @dsCard group="Reserva" height=300 subtitle="Cupos por especialidad y día" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:var(--space-4);background:var(--bg);font-family:var(--font-text);max-width:380px;display:flex;flex-direction:column;gap:var(--space-2)}
  .row{display:flex;align-items:center;justify-content:space-between;gap:var(--space-3);background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:var(--space-3) var(--space-4);min-height:56px}
  .name{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:24px;color:var(--ink)}
  .sub{font-size:13px;line-height:18px;color:var(--muted)}
  .tag{display:inline-flex;align-items:center;gap:var(--space-2);border-radius:var(--radius-pill);padding:6px 12px;font-size:15px;font-weight:600;line-height:20px;white-space:nowrap}
  .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
  .ok{background:var(--state-ok-bg);color:var(--state-ok)}
  .warn{background:var(--state-warn-bg);color:var(--state-warn)}
  .danger{background:var(--state-danger-bg);color:var(--state-danger)}
  .off .name{color:var(--muted)}
</style></head>
<body>
<div class="row"><div><div class="name">Pediatría</div><div class="sub">Hoy · 12 cupos</div></div><span class="tag ok"><span class="dot"></span>Disponible</span></div>
<div class="row"><div><div class="name">Medicina general</div><div class="sub">Hoy · 3 cupos</div></div><span class="tag warn"><span class="dot"></span>Últimos cupos</span></div>
<div class="row off"><div><div class="name">Ginecología</div><div class="sub">Hoy · sin cupos. Prueba mañana</div></div><span class="tag danger"><span class="dot"></span>Agotado</span></div>
</body></html>
