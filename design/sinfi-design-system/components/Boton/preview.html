<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
<style>
  body{margin:0;padding:var(--space-4);background:var(--bg);font-family:var(--font-text);display:flex;flex-direction:column;gap:var(--space-3);max-width:360px}
  .btn{min-height:52px;border-radius:var(--radius-md);font-family:var(--font-text);font-size:17px;font-weight:600;border:2px solid var(--brand);cursor:pointer;width:100%;padding:0 var(--space-4)}
  .btn:focus-visible{outline:3px solid var(--brand);outline-offset:3px}
  .primary{background:var(--brand);color:var(--on-brand)}
  .secondary{background:var(--surface);color:var(--brand)}
  .btn:disabled{background:var(--line);border-color:var(--line);color:var(--muted);cursor:not-allowed}
</style></head>
<body>
<button class="btn primary">Reservar mi ficha</button>
<button class="btn secondary">Ver otros días</button>
<button class="btn primary" disabled>Reservar mi ficha</button>
</body></html>
